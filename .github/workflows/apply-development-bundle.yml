name: Apply validated development bundle
on:
  push:
    branches: [feature/payments-plans-dashboard]
    paths: [.github/workflows/apply-development-bundle.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payments-plans-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all hashes and restore the reviewed source changes
        shell: python
        run: |
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          files = sorted(Path('.build-bridge').glob('part-*.b64'))
          assert len(files) == 11, 'Incomplete source transfer'
          encoded = ''.join(p.read_text().strip() for p in files)
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'f673544681cdb54e73d99c3450d8b32ae9bb0a0e63df18b9a05f45ebe084068b', 'Bundle integrity check failed'
          changes = json.loads(raw)
          prepared = {}
          for name, change in changes.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in ('.gitignore', 'package.json') or path.parts[0] in ('src', 'tests', 'supabase', 'db', 'docs'), name
              assert not any(part in ('.git', '.env', '.env.local', 'node_modules') for part in path.parts), name
              local = Path(name)
              old = local.read_text(encoding='utf-8') if local.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest() == change['old'], 'Base changed: ' + name
              new = old
              for start, end, replacement in reversed(change['edits']):
                  assert 0 <= start <= end <= len(old)
                  new = new[:start] + replacement + new[end:]
              assert hashlib.sha256(new.encode()).hexdigest() == change['new'], 'Restored content mismatch: ' + name
              prepared[local] = new
          for path, text in prepared.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print(f'Restored {len(prepared)} verified source files.')
      - run: npm install
      - run: npm run test:unit
      - run: npm run build
      - name: Commit source and lockfile to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests supabase db docs package.json package-lock.json .gitignore
          git rm -r .build-bridge
          git commit -m 'Implement payment links, bounded plans, paid branding and reliable billing workflows'
          git push origin HEAD:feature/payments-plans-dashboard
