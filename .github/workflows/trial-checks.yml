name: Trial readiness checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trial-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Install isolated browser-test tooling
        run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser regression checks (mock services only)
        run: npx playwright test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check invoice email backend
        run: deno check supabase/functions/send-invoice-email/index.ts
      - name: Backend regression checks (mock services only)
        run: deno test --allow-env supabase/functions/send-invoice-email/index_test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-check-results
          path: test-results/
          retention-days: 7
