name: Isolated development snapshot
on:
  push:
    branches: [feature/payments-plans-dashboard]
    paths: [.github/workflows/workspace-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Export tracked source and dependencies only, never credentials
        run: |
          mkdir -p /tmp/owedly-export
          git ls-files -z | tar --null -T - -czf /tmp/owedly-export/source.tgz
          tar -czf /tmp/owedly-export/dependencies.tgz node_modules package-lock.json
          git rev-parse HEAD > /tmp/owedly-export/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owedly-development-snapshot
          path: /tmp/owedly-export/
          retention-days: 1
